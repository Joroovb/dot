[cursor]
style = "Block"
unfocused_hollow = true

[env]
TERM = "xterm-256color"

[font]
size = 16

  [font.bold]
  family = "IosevkaTerm Nerd Font"
  style = "Bold"


  [font.bold_italic]
  family = "IosevkaTerm Nerd Font"
  style = "Bold Italic"

  [font.italic]
  family = "IosevkaTerm Nerd Font"
  style = "Italic"

  [font.normal]
  family = "IosevkaTerm Nerd Font"
  style = "Regular"
  
[window]
decorations = "Buttonless"
option_as_alt = 'Both'

  [window.padding]
  x = 5
  y = 5
